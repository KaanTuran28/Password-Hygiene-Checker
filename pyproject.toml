[project]
name = "password-hygiene-checker"
version = "0.1.0"
description = "Check password strength and breach exposure via HIBP k-anonymity, without ever exposing the password."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = ["requests>=2.31.0"]

[project.scripts]
password-hygiene-checker = "password_hygiene_checker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["password_hygiene_checker"]

[tool.ruff]
line-length = 100
target-version = "py39"
